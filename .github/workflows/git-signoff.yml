name: attested by humans

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read   # scan-refs: auto asks which merged pull request produced the pushed merge

jobs:
  verify-signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — attestations live in it
      - uses: jerrylin96/git-signoff/verify@verify-v1.7
