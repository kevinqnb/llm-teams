name: qwen3.5-4b-thinking
backend: vllm
model_id: Qwen/Qwen3.5-4B
# max_model_len leaves room for the prompt plus a 12000-token thinking budget and the visible reply.
engine_kwargs: {dtype: bfloat16, max_model_len: 32768, gpu_memory_utilization: 0.85}
enable_thinking: true
# Sampling values are the plan's defaults; check them against the model card before real runs.
sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, max_tokens: 2048}
# max_tokens is the thinking budget; the backend adds comms.max_message_tokens on top for messages.
thinking_sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, max_tokens: 12000}
