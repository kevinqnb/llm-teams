# Free-text vs structured (raise/lower/hold) messaging, with thinking on.
# p=0 is left out: with no clique the message format is irrelevant, so it would just run the same
# condition twice. Run that baseline separately (message_format: free, p: 0.0).
name: sum_clique_format
task: sum_to_target
dataset: sum_to_target_default
model: qwen3.5-4b-thinking
prompt: sum_to_target/default
agents: {type: llm, know_n: true, know_id: true, memory: structured}
episode: {max_turns: 20, invalid_policy: random}
comms:
  action_graph: {generator: empty}
  message_graph: {generator: clique, p: 0.5, resample: fixed}
  discussion_rounds: 1
  planning_rounds: 0
  max_message_tokens: 200
  reveal_group: true
  message_format: free
seed: 0
episodes_per_batch: 64
sweep:
  comms.message_format: [free, structured]
  dataset.n: [4, 8, 16]
  comms.message_graph.p: [0.25, 0.5, 0.75, 1.0]
