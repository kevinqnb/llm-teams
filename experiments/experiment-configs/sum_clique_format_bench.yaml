# Throughput/truncation benchmark for sum_clique_format: n=20, p=0.5, 2 turns, both formats.
# Submit with: -- --set dataset.num_episodes=2
name: sum_clique_format_bench
task: sum_to_target
dataset: sum_to_target_default
model: qwen3.5-4b-thinking
prompt: sum_to_target/default
agents: {type: llm, know_n: true, know_id: true, memory: structured}
episode: {max_turns: 2, invalid_policy: random}
comms:
  action_graph: {generator: empty}
  message_graph: {generator: clique, p: 0.5, resample: fixed}
  discussion_rounds: 1
  planning_rounds: 0
  max_message_tokens: 200
  reveal_group: true
  message_format: free
seed: 0
episodes_per_batch: 64
sweep:
  comms.message_format: [free, structured]
  dataset.n: [20]
