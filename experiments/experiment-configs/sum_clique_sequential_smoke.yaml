# 2x2: simultaneous vs sequential discussion, free vs structured messages. In sequential mode
# speakers go one at a time in a random order and see what earlier speakers posted.
name: sum_clique_sequential_smoke
task: sum_to_target
dataset: sum_to_target_smoke
model: qwen3.5-4b
prompt: sum_to_target/default
agents: {type: llm, know_n: true, know_id: true, memory: structured}
episode: {max_turns: 10, invalid_policy: random}
comms:
  action_graph: {generator: empty}
  message_graph: {generator: clique, p: 1.0, resample: fixed}
  discussion_rounds: 1
  max_message_tokens: 200
  reveal_group: true
  message_format: structured
  discussion_order: simultaneous
seed: 0
episodes_per_batch: 64
sweep:
  comms.discussion_order: [simultaneous, sequential]
  comms.message_format: [free, structured]
