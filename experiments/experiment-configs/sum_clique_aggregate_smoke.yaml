# Sequential structured discussion: named signals (who said what) vs aggregate counts
# ("2 raise, 1 lower, 0 hold"). Isolates the effect of identities from the effect of ordering.
name: sum_clique_aggregate_smoke
task: sum_to_target
dataset: sum_to_target_smoke
model: qwen3.5-4b
prompt: sum_to_target/default
agents: {type: llm, know_n: true, know_id: true, memory: structured}
episode: {max_turns: 10, invalid_policy: random}
comms:
  action_graph: {generator: empty}
  message_graph: {generator: clique, p: 1.0, resample: fixed}
  discussion_rounds: 1
  max_message_tokens: 200
  reveal_group: true
  message_format: structured
  discussion_order: sequential
  board_view: named
seed: 0
episodes_per_batch: 64
sweep:
  comms.board_view: [named, aggregate]
