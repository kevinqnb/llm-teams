# Scripted reference curve vs clique size: clique coordinates perfectly, outsiders play randomly.
name: sum_clique_controller
task: sum_to_target
dataset: sum_to_target_n16
agents: {type: clique_controller, know_n: true, know_id: true, outsider_p: 0.5}
episode: {max_turns: 20}
comms:
  action_graph: {generator: empty}
  message_graph: {generator: clique, p: 0.5, resample: fixed}
  reveal_group: true
seed: 0
sweep:
  comms.message_graph.p: [0.0, 0.25, 0.5, 0.75, 1.0]
