# Sequential discussion + aggregate board, structured raise/lower/hold messages, n=20, 10 games.
# Only the discussion phase thinks (2048-token soft budget); actions do not think.
name: sum_clique_seqagg
task: sum_to_target
dataset: sum_to_target_n20_g10
model: qwen3.5-4b-think2k
prompt: sum_to_target/default
agents: {type: llm, know_n: true, know_id: true, memory: structured, thinking_phases: [discussion]}
episode: {max_turns: 12, invalid_policy: random}
comms:
  action_graph: {generator: empty}
  message_graph: {generator: clique, p: 0.5, resample: fixed}
  discussion_rounds: 1
  planning_rounds: 0
  max_message_tokens: 200
  reveal_group: true
  message_format: structured
  discussion_order: sequential
  board_view: aggregate
seed: 0
episodes_per_batch: 64
sweep:
  comms.message_graph.p: [0.25, 0.5, 1.0]
