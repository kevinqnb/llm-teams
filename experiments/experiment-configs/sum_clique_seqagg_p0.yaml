# p=0 baseline (no clique, so no messages) for sum_clique_seqagg; same settings otherwise. Same `name`,
# so its runs land in the same results directory. Run separately so the other conditions are not resubmitted.
name: sum_clique_seqagg
task: sum_to_target
dataset: sum_to_target_n20_g10
model: qwen3.5-4b-think2k
prompt: sum_to_target/brief
agents: {type: llm, know_n: true, know_id: true, memory: structured, thinking_phases: [discussion]}
episode: {max_turns: 20, invalid_policy: random}
comms:
  action_graph: {generator: empty}
  message_graph: {generator: clique, p: 0.5, resample: fixed}
  discussion_rounds: 1
  planning_rounds: 0
  max_message_tokens: 200
  reveal_group: true
  message_format: structured
  discussion_order: sequential
  board_view: aggregate
seed: 0
episodes_per_batch: 64
sweep:
  comms.message_graph.p: [0.0]
