# Quick first look at free vs structured messaging: n=20, p in {0.5, 1}, 12 turns max, thinking
# capped softly at 2048 tokens. Submit with: -- --set dataset.num_episodes=20
name: sum_clique_format_quick
task: sum_to_target
dataset: sum_to_target_default
model: qwen3.5-4b-think2k
prompt: sum_to_target/default
agents: {type: llm, know_n: true, know_id: true, memory: structured}
episode: {max_turns: 12, invalid_policy: random}
comms:
  action_graph: {generator: empty}
  message_graph: {generator: clique, p: 0.5, resample: fixed}
  discussion_rounds: 1
  planning_rounds: 0
  max_message_tokens: 200
  reveal_group: true
  message_format: free
seed: 0
episodes_per_batch: 64
sweep:
  comms.message_format: [free, structured]
  dataset.n: [20]
  comms.message_graph.p: [0.5, 1.0]
