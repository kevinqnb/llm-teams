[project]
name = "llm-teams"
version = "0.1.0"
description = "Harness for testing teams of LLM agents under varying visibility and communication."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pydantic>=2",
    "pyyaml",
    "jinja2",
]

[project.optional-dependencies]
vllm = ["vllm"]
analysis = ["pandas", "matplotlib"]

[project.scripts]
llm-teams = "llm_teams.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_teams"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
src = ["src", "tests", "analysis"]

[tool.ruff.lint]
ignore = ["UP046"]
select = ["E", "F", "I", "UP", "B"]
